name: "Build Test and Deploy"
on:
  pull_request_target:
    branches: [ main ]
    types:
      - closed
  workflow_dispatch:
    inputs:
      version-bump:
        description: "Version bump"
        type: choice
        options:
          - patch
          - minor
          - major
        default: patch
      flow:
        description: "Release flow"
        type: choice
        options:
          - release
          - draft
          - dry-run
        default: release

# Least privilege: this workflow runs on pull_request_target (merged PRs), so the default
# token is read-only and write is granted per-job only where actually needed (tag/release).
permissions:
  contents: read

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  check-release:
    name: Check if release is needed
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read  # lists the merged PR's changed files via the REST API
    outputs:
      flow: ${{ steps.check.outputs.flow }}
      gradle-args: ${{ steps.check.outputs.gradle-args }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Determine release flow
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Manual dispatch has no PR to inspect — take flow and version
          # bump straight from the workflow inputs.
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "${{ inputs.version-bump }}" in
              major) echo "gradle-args=-PincrementMajor=true" >> $GITHUB_OUTPUT ;;
              minor) echo "gradle-args=-PincrementMinor=true" >> $GITHUB_OUTPUT ;;
              *)     echo "gradle-args=" >> $GITHUB_OUTPUT ;;
            esac
            echo "flow=${{ inputs.flow }}" >> $GITHUB_OUTPUT
            exit 0
          fi

          gradle_args=""
          if ${{ contains(github.event.pull_request.labels.*.name, 'major') }}; then
            gradle_args="-PincrementMajor=true"
          elif ${{ contains(github.event.pull_request.labels.*.name, 'minor') }}; then
            gradle_args="-PincrementMinor=true"
          fi
          echo "gradle-args=${gradle_args}" >> $GITHUB_OUTPUT

          # Check for skip-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'skip-release') }}; then
            echo "flow=dry-run" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check for draft-release label
          if ${{ contains(github.event.pull_request.labels.*.name, 'draft-release') }}; then
            echo "flow=draft" >> $GITHUB_OUTPUT
            exit 0
          fi

          # Check if only non-code files changed.
          # Use the paginated "list PR files" API rather than `gh pr diff`: the
          # latter hits the .diff endpoint, which GitHub caps at 300 files and
          # returns HTTP 406 for larger PRs.
          # The PR-files API returns objects with a `filename` field, not `path`.
          # The earlier `gh pr diff --name-only` shortcut emitted bare filenames;
          # switching to the API silently broke the loop when this used `.path`.
          changed_files=$(gh api --paginate \
            "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" \
            --jq '.[].filename')
          for file in $changed_files; do
            case "$file" in
              .github/*|*.md|.gitignore|.editorconfig|CLAUDE.md|LICENSE|*.txt)
                ;;
              *)
                echo "Code file changed: $file"
                echo "flow=release" >> $GITHUB_OUTPUT
                exit 0
                ;;
            esac
          done

          echo "Only non-code files changed, skipping"
          echo "flow=skip" >> $GITHUB_OUTPUT

  # One version for the whole run, computed before anything builds. The bump flags live
  # in gradle-args, so this has to run after check-release. See compute-version.yaml for
  # why every downstream job reads this instead of computing its own.
  version:
    needs: check-release
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/compute-version.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}

  # Note: this run CANNOT write Actions caches, and no `permissions:` grant changes that.
  #
  # `pull_request_target` on a CLOSED pr resolves to `refs/pull/N/merge`, which stops
  # being a writable cache scope once the PR is merged, so every cache save in these
  # builds fails with `cache write denied: token has no writable scopes` regardless of
  # token scopes. This repo's logs show the same key saving fine from a `pull_request`
  # run whose token was equally read-only, which is what rules out the scopes as the
  # cause. See warm-cache.yaml — it runs on `push: branches: [main]`, where the ref is
  # writable, and is what actually keeps main's caches populated for PRs to restore.
  build-linux:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-linux.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      version: ${{ needs.version.outputs.version }}
      # For an actual release/draft publish-to-Central, force a clean, cache-free rebuild
      # of the published artifacts. Non-publishing flows (dry-run) reuse the build cache.
      clean-publish: ${{ needs.check-release.outputs.flow == 'release' || needs.check-release.outputs.flow == 'draft' }}

  # Same cache-write caveat as build-linux above.
  build-apple:
    needs: [check-release, version]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/build-apple.yaml
    with:
      gradle-args: ${{ needs.check-release.outputs.gradle-args }}
      version: ${{ needs.version.outputs.version }}
      # For an actual release/draft publish-to-Central, force a clean, cache-free rebuild
      # of the published artifacts. Non-publishing flows (dry-run) reuse the build cache.
      clean-publish: ${{ needs.check-release.outputs.flow == 'release' || needs.check-release.outputs.flow == 'draft' }}

  validate:
    needs: [check-release, version, build-linux, build-apple]
    if: needs.check-release.outputs.flow != 'skip'
    uses: ./.github/workflows/validate-artifacts.yaml
    with:
      version: ${{ needs.version.outputs.version }}

  publish:
    needs: [check-release, version, validate]
    if: needs.check-release.outputs.flow == 'draft' || needs.check-release.outputs.flow == 'release'
    uses: ./.github/workflows/publish-to-central.yaml
    with:
      publishing-type: ${{ needs.check-release.outputs.flow == 'draft' && 'USER_MANAGED' || 'AUTOMATIC' }}
      version: ${{ needs.version.outputs.version }}
    secrets:
      GPG_KEY_CONTENTS: ${{ secrets.GPG_KEY_CONTENTS }}
      SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      MAVEN_CENTRAL_USERNAME: ${{ secrets.MAVEN_CENTRAL_USERNAME }}
      MAVEN_CENTRAL_PASSWORD: ${{ secrets.MAVEN_CENTRAL_PASSWORD }}

  finalize:
    name: Finalize Release
    needs: [check-release, version, publish]
    if: always() && needs.check-release.outputs.flow != 'skip' && needs.check-release.outputs.flow != 'dry-run'
    runs-on: ubuntu-latest
    permissions:
      contents: write # pushes the version tag and creates the GitHub release
      id-token: write # OIDC for SLSA build-provenance attestation
      attestations: write # write provenance + SBOM attestations to the GitHub attestation store
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Create draft GitHub release
        if: needs.check-release.outputs.flow == 'draft' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          version="${{ needs.version.outputs.version }}"
          deployment_id="${{ needs.publish.outputs.deployment-id }}"
          staging_url="https://central.sonatype.com/publishing/deployments"

          gh release create "v${version}" \
              --draft \
              --repo="$GITHUB_REPOSITORY" \
              --title="v${version}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Status:** Awaiting validation in [Maven Central Staging](${staging_url})
          **Deployment ID:** \`${deployment_id}\`

          ### To complete release:
          1. Validate artifacts in Maven Central staging area
          2. Run the 'Complete or Cancel Release' workflow with action 'complete' and version '${version}'

          ### To cancel:
          1. Run the 'Complete or Cancel Release' workflow with action 'cancel' and version '${version}'
          2. This will drop the deployment and delete this draft release
          EOF
          )"

      - name: Create tag and GitHub release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_TITLE: ${{ github.event.pull_request.title || 'Manual release' }}
          PR_URL: ${{ github.event.pull_request.html_url || format('{0}/{1}', github.server_url, github.repository) }}
        run: |
          version="${{ needs.version.outputs.version }}"
          tag="v${version}"

          # Check if tag already exists
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists, skipping"
            exit 0
          fi

          # Create and push tag
          git tag "$tag"
          git push origin "$tag"

          # Create release
          maven_url="https://central.sonatype.com/artifact/com.ditchoom/buffer/${version}"
          gh release create "$tag" \
              --repo="$GITHUB_REPOSITORY" \
              --title="${tag}" \
              --notes="$(cat <<EOF
          ## [${PR_TITLE}](${PR_URL})

          **Maven Central:** [com.ditchoom:buffer:${version}](${maven_url})
          EOF
          )"

      # ---- Supply-chain: SBOM + SLSA build provenance for the published artifacts ----
      # Runs whenever publish succeeded (draft or release). Uses the exact same artifact
      # bundle the publish job uploaded to Maven Central, so the attested digests match
      # what consumers download.
      - name: Download published artifacts
        if: needs.publish.result == 'success'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: maven-local-merged
          path: /tmp/maven-repo

      - name: Generate SBOM (CycloneDX)
        if: needs.publish.result == 'success'
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0
        with:
          path: /tmp/maven-repo
          format: cyclonedx-json
          output-file: /tmp/buffer-sbom.cdx.json
          artifact-name: buffer-sbom.cdx.json

      - name: Attest build provenance
        if: needs.publish.result == 'success'
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          # The shipped binaries: JVM/Android jars+aars and Kotlin/Native klibs.
          subject-path: |
            /tmp/maven-repo/**/*.jar
            /tmp/maven-repo/**/*.klib
            /tmp/maven-repo/**/*.aar

      - name: Attest SBOM
        if: needs.publish.result == 'success'
        uses: actions/attest-sbom@c604332985a26aa8cf1bdc465b92731239ec6b9e # v4.1.0
        with:
          subject-path: |
            /tmp/maven-repo/**/*.jar
            /tmp/maven-repo/**/*.klib
            /tmp/maven-repo/**/*.aar
          sbom-path: /tmp/buffer-sbom.cdx.json

      - name: Attach SBOM to release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="${{ needs.version.outputs.version }}"
          gh release upload "v${version}" /tmp/buffer-sbom.cdx.json \
            --repo="$GITHUB_REPOSITORY" --clobber

      # ---- Hold the `deploy` slot until Central can be read correctly again ----
      #
      # compute-version.yaml derives the next version from a LIVE read of Central's
      # maven-metadata.xml <latest> (see getNextVersion in gradle/setup.gradle.kts).
      # Central serves the artifacts well before that file reflects them, so a release
      # cut inside the lag window reads a stale <latest> and computes a version <= the
      # one just shipped.
      #
      # This is not hypothetical. v6.28.0 was tagged 2026-08-10T23:43:34Z; the next
      # merged run computed 6.27.1 — content-wise a SUPERSET of 6.28.0 (its commit is a
      # descendant), published BENEATH it. Central's <release> pointer stayed at 6.28.0,
      # so nobody tracking latest ever received that fix, and every job in both runs
      # reported success. Measured lag on the follow-up release: tagged 06:40:30Z,
      # metadata lastUpdated 06:53:29Z — about 13 minutes. The 30-minute ceiling below
      # is roughly 2.3x that.
      #
      # The `concurrency: deploy` group at the top of this file already serializes RUNS.
      # The gap it cannot close is that a run FINISHES before Central catches up — which
      # is why switching compute-version to read git tags instead would NOT have helped
      # either: when 6.27.1 was computed, the v6.28.0 tag did not exist yet. Holding this
      # job open is what closes it, because the next merged run queues behind this one and
      # is then guaranteed a fresh read.
      #
      # Fails rather than warns on timeout, deliberately. The release itself has already
      # succeeded by this point — tag, GitHub release, attestations and SBOM are all done
      # above, and nothing here can undo any of it. A red X here means "the invariant the
      # NEXT release depends on is not established yet", which is worth a loud false
      # alarm; the alternative is the silent regression described above, which surfaces
      # weeks later as "why is Central serving an older version than our newest tag".
      - name: Wait for Central to index this release
        if: needs.check-release.outputs.flow == 'release' && needs.publish.result == 'success'
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          set -uo pipefail
          url="https://repo1.maven.org/maven2/com/ditchoom/buffer/maven-metadata.xml"
          latest=""
          for i in $(seq 1 60); do
            # `|| true` so a transient network blip is just another poll, not a job failure.
            latest="$(curl -sf --max-time 30 "$url" \
                      | sed -n 's:.*<latest>\(.*\)</latest>.*:\1:p' || true)"
            if [ "$latest" = "$VERSION" ]; then
              echo "Central <latest> reports $latest after ~$((i * 30))s. Next release will read a current value."
              exit 0
            fi
            echo "poll $i/60: <latest>=${latest:-unreadable}, waiting for $VERSION"
            sleep 30
          done
          echo "::error::Central still reports <latest>=${latest:-unreadable} after 30m, not $VERSION. \
          The release SUCCEEDED — v$VERSION is tagged, released and uploaded, and nothing needs undoing. \
          This gate protects the NEXT release, which reads <latest> to pick its version and would \
          compute a stale one. Before releasing again, confirm $url shows $VERSION."
          exit 1
